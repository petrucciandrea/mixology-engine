[project]
name = "mixology-engine-backend"
version = "0.1.0"
description = "Backend enterprise per bilanciamento cocktail d'autore (Clean Architecture, DDD, Constrained Optimization)"
requires-python = ">=3.12,<3.13"
readme = "README.md"

dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy[asyncio]>=2.0.36,<3",
    "asyncpg>=0.30,<0.31",
    "alembic>=1.14,<2",
    "redis>=5.2,<6",
    "scipy>=1.14,<2",
    "numpy>=2.1,<3",
    "networkx>=3.4,<4",
    "pgvector>=0.3.6,<0.4",
]

[project.optional-dependencies]
# Attivati nello step "Selector/Matcher" (embeddings organolettici via pgvector).
# Separati perché sentence-transformers + torch appesantiscono notevolmente
# l'immagine Docker: li introduciamo solo quando implementiamo il matcher.
embeddings = [
    "sentence-transformers>=3.3,<4",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<0.25",
    "pytest-cov>=6.0,<7",
    "hypothesis>=6.115,<7",
    "httpx>=0.27,<0.28",
    "ruff>=0.7,<0.8",
    "mypy>=1.13,<2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# `--cov-fail-under` rende la copertura un vincolo e non solo una misura.
# La soglia è deliberatamente sotto il valore attuale: serve a impedire
# regressioni, non a inseguire il 100% scrivendo test privi di valore.
addopts = "-v --strict-markers --cov=app --cov-report=term-missing --cov-fail-under=85"
markers = [
    "integration: richiede PostgreSQL in esecuzione (rollback per test)",
    "api: richiede l'intero stack (PostgreSQL + Redis)",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "N"]
ignore = ["B008"]  # FastAPI Depends() come default arg è pattern idiomatico

[tool.ruff.lint.isort]
# Senza questo, isort tratta `app` come libreria di terze parti e nei test
# lo mescola a pytest e httpx, nascondendo la distinzione fra codice del
# progetto e dipendenze esterne.
known-first-party = ["app", "tests"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/"]

# SciPy e pgvector non distribuiscono annotazioni (nessun `py.typed`).
# L'alternativa sarebbe installare pacchetti di stub di terze parti, che
# aggiungono una dipendenza e un disallineamento di versione da mantenere
# per due soli punti di contatto: `scipy.optimize.minimize` in
# `balancing_solver.py` e il tipo `Vector` nei modelli ORM. Entrambi sono
# incapsulati dietro firme tipizzate del progetto, quindi la perdita di
# verifica si ferma alla riga di import.
[[tool.mypy.overrides]]
module = ["scipy.*", "pgvector.*"]
ignore_missing_imports = true
