[project]
name = "mixology-engine-backend"
version = "0.1.0"
description = "Backend enterprise per bilanciamento cocktail d'autore (Clean Architecture, DDD, Constrained Optimization)"
requires-python = ">=3.12,<3.13"
readme = "README.md"

dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy[asyncio]>=2.0.36,<3",
    "asyncpg>=0.30,<0.31",
    "alembic>=1.14,<2",
    "redis>=5.2,<6",
    "scipy>=1.14,<2",
    "numpy>=2.1,<3",
    "networkx>=3.4,<4",
    "pgvector>=0.3.6,<0.4",
]

[project.optional-dependencies]
# Attivati nello step "Selector/Matcher" (embeddings organolettici via pgvector).
# Separati perché sentence-transformers + torch appesantiscono notevolmente
# l'immagine Docker: li introduciamo solo quando implementiamo il matcher.
embeddings = [
    "sentence-transformers>=3.3,<4",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<0.25",
    "pytest-cov>=6.0,<7",
    "hypothesis>=6.115,<7",
    "httpx>=0.27,<0.28",
    "ruff>=0.7,<0.8",
    "mypy>=1.13,<2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "N"]
ignore = ["B008"]  # FastAPI Depends() come default arg è pattern idiomatico

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/"]
